name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the upstream remote
        run: git remote add upstream https://pdfium.googlesource.com/pdfium

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: CONTAINER=docker inkbar/build.sh

      - name: Smoke test
        run: node inkbar/smoke.mjs testing/resources/hello_world.pdf

      - name: Write the manifest
        run: inkbar/write-manifest.sh "$TAG"

      - name: Package
        run: |
          SHA="$(inkbar/package.sh "$TAG")"
          {
            echo "Upstream commit: $(jq -r .upstreamCommit inkbar/out/manifest.json)"
            echo "Chromium branch: $(jq -r .chromiumBranch inkbar/out/manifest.json)"
            echo "Gzipped module size: $(jq -r .wasmGzipBytes inkbar/out/manifest.json) bytes"
            echo "Archive SHA-256: $SHA"
          } > inkbar/out/notes.txt
          cat inkbar/out/notes.txt
          df -h /

      - name: Publish the release
        run: |
          gh release create "$TAG" "inkbar/out/inkbar-pdfium-wasm32-$TAG.tar.gz" \
            --title "$TAG" --notes-file inkbar/out/notes.txt
