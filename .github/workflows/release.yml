name: release

# A feat or fix merged to main changes the module, so it is released. Anything else is released
# only when someone runs this workflow by hand from main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.event.head_commit.message, 'feat') ||
        startsWith(github.event.head_commit.message, 'fix')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the upstream remote
        run: git remote add upstream https://pdfium.googlesource.com/pdfium

      - name: Choose the tag
        run: |
          released="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [[ -n "$released" ]]; then
            echo "::error::This commit is already released as $released."
            exit 1
          fi
          TAG="$(inkbar/next-tag.sh)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: CONTAINER=docker inkbar/build.sh

      - name: Smoke test
        run: node inkbar/smoke.mjs testing/resources/hello_world.pdf

      - name: Write the manifest
        run: inkbar/write-manifest.sh "$TAG"

      - name: Package
        run: |
          SHA="$(inkbar/package.sh "$TAG")"
          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          {
            git log --reverse --format='- %s' ${PREVIOUS:+"$PREVIOUS"..}HEAD
            echo
            echo "Upstream commit: $(jq -r .upstreamCommit inkbar/out/manifest.json)"
            echo "Chromium branch: $(jq -r .chromiumBranch inkbar/out/manifest.json)"
            echo "Gzipped module size: $(jq -r .wasmGzipBytes inkbar/out/manifest.json) bytes"
            echo "Archive SHA-256: $SHA"
          } > inkbar/out/notes.txt
          cat inkbar/out/notes.txt
          df -h /

      - name: Publish the release
        run: |
          gh release create "$TAG" "inkbar/out/inkbar-pdfium-wasm32-$TAG.tar.gz" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file inkbar/out/notes.txt
